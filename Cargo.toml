[package]
name = "dev-projects-cleaner"
version = "1.0.0"
edition = "2021"
description = "DevProjectsCleaner — removes temporary and build files from any project"
license = "MIT"

[[bin]]
name = "DevProjectsCleaner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
trash = "3"
colored = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
